<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- herdrm app icon: full-bleed square artwork (sidebar + terminal pane on a
       top-to-bottom blue gradient). Icon Composer applies the squircle mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0050FF"/>
      <stop offset="0.5" stop-color="#0078FF"/>
      <stop offset="1" stop-color="#00A4FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B4DAFF"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#C6E4FF" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002A8C" flood-opacity="0.30"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g>
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"><line x1="128" y1="0" x2="128" y2="1024"/><line x1="0" y1="128" x2="1024" y2="128"/><line x1="256" y1="0" x2="256" y2="1024"/><line x1="0" y1="256" x2="1024" y2="256"/><line x1="384" y1="0" x2="384" y2="1024"/><line x1="0" y1="384" x2="1024" y2="384"/><line x1="512" y1="0" x2="512" y2="1024"/><line x1="0" y1="512" x2="1024" y2="512"/><line x1="640" y1="0" x2="640" y2="1024"/><line x1="0" y1="640" x2="1024" y2="640"/><line x1="768" y1="0" x2="768" y2="1024"/><line x1="0" y1="768" x2="1024" y2="768"/><line x1="896" y1="0" x2="896" y2="1024"/><line x1="0" y1="896" x2="1024" y2="896"/></g>
    <circle cx="512" cy="512" r="320" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
    
  </g>
  <g filter="url(#sh)">
    <rect x="232" y="296" width="200" height="432" rx="56" fill="url(#soft)"/>
    <rect x="462" y="296" width="330" height="432" rx="56" fill="url(#glass)"/>
    <path d="M552 448 L630 512 L552 576" fill="none" stroke="#0064FF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="652" y="556" width="66" height="36" rx="14" fill="#0064FF" fill-opacity="0.5"/>
  </g>
</svg>
